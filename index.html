<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get Landlock</title>
  <meta
    name="description"
    content="Download Landlock — auto-block distracting apps when you walk into the places that matter."
  />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f3f3ec" />
  <meta property="og:title" content="Get Landlock" />
  <meta
    property="og:description"
    content="It's time to regain control of your space."
  />
  <meta property="og:url" content="https://landlock.app/" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://landlock.app/assets/app-logo.png" />
  <link rel="canonical" href="https://landlock.app/" />
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css?v=7" />
  <script>
    (function () {
      // Instant hop for real browsers (Safari/Chrome) — e.g. someone sees
      // landlock.app on TikTok and types it into Safari.
      var PROVIDER_TOKEN = "";
      var ua = navigator.userAgent || "";
      var ios =
        /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var android = /Android/i.test(ua);
      var inApp =
        /Instagram|Barcelona|FBAN|FBAV|FB_IAB|Messenger|TikTok|Bytedance|ByteLocale|musical_ly|TTWebView/i.test(
          ua
        );
      if ((!ios && !android) || inApp) return;

      var params = new URLSearchParams(location.search);
      var ct = (
        params.get("src") ||
        params.get("ct") ||
        params.get("c") ||
        "web"
      )
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "_")
        .replace(/[^a-z0-9_-]/g, "")
        .slice(0, 40) || "web";

      var q = "mt=8&ct=" + encodeURIComponent(ct);
      if (PROVIDER_TOKEN) q += "&pt=" + encodeURIComponent(PROVIDER_TOKEN);
      var href =
        "https://apps.apple.com/us/app/landlock/id6789275579?" + q;

      window.__LANDLOCK_REDIRECTED__ = true;
      location.replace(href);
    })();
  </script>
</head>
<body>
  <main class="page">
    <div class="brand-block">
      <div class="icon-wrap">
        <img
          class="app-icon"
          src="assets/app-logo.png?v=7"
          width="512"
          height="512"
          alt="Landlock app icon"
        />
      </div>

      <header class="hero">
        <h1 class="title" id="title">
          Taking you to <span class="accent">Landlock</span>…
        </h1>
        <p class="lede" id="subtitle">Hang tight, we're opening the App Store.</p>
      </header>
    </div>

    <div class="dock">
      <a
        class="btn"
        id="store-link"
        href="https://apps.apple.com/us/app/landlock/id6789275579?mt=8&ct=web"
      >
        Get Landlock
      </a>
      <p class="hint">Available on iPhone</p>
    </div>
  </main>

  <script src="app.js?v=7"></script>
</body>
</html>
