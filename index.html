<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Landlock</title>
  <meta
    name="description"
    content="Landlock — auto-block distracting apps when you walk into the places that matter."
  />
  <meta name="theme-color" content="#f3f3ec" />
  <meta property="og:title" content="Landlock" />
  <meta
    property="og:description"
    content="It's time to regain control of your space."
  />
  <meta property="og:url" content="https://landlock.app/" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://landlock.app/assets/app-logo.png" />
  <link rel="canonical" href="https://landlock.app/" />
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css?v=5" />
  <script>
    (function () {
      // Optional App Store Connect provider token for campaign reports.
      var PROVIDER_TOKEN = "";

      var ua = navigator.userAgent || "";
      var apple =
        /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      // Instagram / Facebook / TikTok webviews break on itms-apps:// and
      // often paint a blank white page. Show the landing UI instead; a tap
      // opens the App Store reliably.
      var inAppBrowser =
        /Instagram|FBAN|FBAV|FB_IAB|Twitter|TikTok|ByteLocale|Bytedance|Line\//i.test(
          ua
        );

      var params = new URLSearchParams(location.search);
      var ct = (
        params.get("ct") ||
        params.get("utm_campaign") ||
        params.get("c") ||
        "instagram_bio"
      )
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "_")
        .replace(/[^a-z0-9_-]/g, "")
        .slice(0, 40) || "instagram_bio";

      var q = "mt=8&ct=" + encodeURIComponent(ct);
      if (PROVIDER_TOKEN) q += "&pt=" + encodeURIComponent(PROVIDER_TOKEN);

      var httpsUrl =
        "https://apps.apple.com/us/app/landlock/id6789275579?" + q;

      window.__LANDLOCK_STORE_URL__ = httpsUrl;

      if (!apple || inAppBrowser) {
        if (inAppBrowser) document.documentElement.className += " in-app";
        return;
      }

      // Safari / Chrome on iPhone: HTTPS App Store redirect (no itms-apps).
      document.documentElement.className += " ios-redirect";
      location.replace(httpsUrl);
    })();
  </script>
</head>
<body>
  <main class="page">
    <div class="brand-block">
      <div class="icon-wrap">
        <img
          class="app-icon"
          src="assets/app-logo.png?v=5"
          width="512"
          height="512"
          alt="Landlock app icon"
        />
      </div>

      <header class="hero">
        <h1 class="brand">Landlock</h1>
        <p class="lede">It's time to regain control of your space.</p>
      </header>
    </div>

    <div class="dock">
      <a
        class="btn"
        id="store-link"
        href="https://apps.apple.com/us/app/landlock/id6789275579?mt=8&ct=instagram_bio"
      >
        Get the app
      </a>
      <p class="hint" id="hint">Available on iPhone</p>
    </div>
  </main>

  <script src="app.js?v=5"></script>
</body>
</html>
