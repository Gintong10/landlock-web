<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Landlock</title>
  <meta
    name="description"
    content="Landlock — auto-block distracting apps when you walk into the places that matter."
  />
  <meta name="theme-color" content="#f3f3ec" />
  <meta property="og:title" content="Landlock" />
  <meta
    property="og:description"
    content="Auto-block distracting apps when you walk into the places that matter."
  />
  <meta property="og:url" content="https://landlock.app/" />
  <meta property="og:type" content="website" />
  <link rel="canonical" href="https://landlock.app/" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      // Optional App Store Connect provider token for campaign reports.
      var PROVIDER_TOKEN = "";

      var ua = navigator.userAgent || "";
      var apple =
        /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      if (!apple) return;

      document.documentElement.className += " ios-redirect";

      var params = new URLSearchParams(location.search);
      var ct = (
        params.get("ct") ||
        params.get("utm_campaign") ||
        params.get("c") ||
        "instagram_bio"
      )
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "_")
        .replace(/[^a-z0-9_-]/g, "")
        .slice(0, 40) || "instagram_bio";

      var q = "mt=8&ct=" + encodeURIComponent(ct);
      if (PROVIDER_TOKEN) q += "&pt=" + encodeURIComponent(PROVIDER_TOKEN);

      var httpsUrl =
        "https://apps.apple.com/us/app/landlock/id6789275579?" + q;
      var itmsUrl = "itms-apps://apps.apple.com/app/id6789275579?" + q;

      location.replace(itmsUrl);
      setTimeout(function () {
        location.replace(httpsUrl);
      }, 450);
    })();
  </script>
</head>
<body>
  <main class="shell">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M12 3v18" />
        <path d="M5 8.5c2.8-2.2 5.2-2.2 7-2.2s4.2 0 7 2.2" />
        <path d="M6.5 13.5c2.2-1.5 4-1.5 5.5-1.5s3.3 0 5.5 1.5" />
        <path d="M8.5 18c1.4-.9 2.5-.9 3.5-.9s2.1 0 3.5.9" />
      </svg>
    </div>

    <h1 class="brand">Landlock</h1>
    <p class="lede">
      Auto-block distracting apps when you walk into the places that matter.
    </p>

    <div class="actions">
      <a
        class="btn"
        id="store-link"
        href="https://apps.apple.com/us/app/landlock/id6789275579?mt=8&ct=instagram_bio"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M16.5 2.5c-.9.1-2 .7-2.6 1.5-.6.7-1.1 1.8-1 2.8 1 .1 2-.5 2.6-1.3.7-.8 1.1-1.9 1-3zM19.2 8.3c-1.9-.1-3.5 1.1-4.4 1.1-.9 0-2.3-1-3.8-1-1.9.1-3.7 1.1-4.7 2.9-2 3.5-.5 8.6 1.4 11.4.9 1.4 2 2.9 3.4 2.9 1.3 0 1.8-.9 3.4-.9s2 .9 3.4.8c1.4 0 2.3-1.3 3.2-2.7.6-.9 1.1-1.9 1.4-2.9-3.5-1.3-4.1-6.3-.7-8.2-.9-1.2-2.2-1.9-3.6-2.4z"
          />
        </svg>
        Download on the App Store
      </a>
      <p class="hint">
        iPhone only ·
        <a id="open-link" href="https://apps.apple.com/us/app/landlock/id6789275579">
          Open App Store
        </a>
      </p>
    </div>

    <p class="footer">landlock.app</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
